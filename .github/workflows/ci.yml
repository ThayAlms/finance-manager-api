name: Testes Python

on:
  push:
    branches: ["main", "feature/python-vitor", "checkpoint-2"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: caixalivre
          POSTGRES_USER: caixalivre
          POSTGRES_PASSWORD: caixalivre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caixalivre -d caixalivre"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validar migração PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://caixalivre:caixalivre@localhost:5432/caixalivre
          SECRET_KEY: chave-apenas-para-ci
        run: alembic upgrade head
      - name: Validar sintaxe e testes
        run: |
          python -m compileall -q app tests alembic
          pytest -q
      - name: Validar frontend
        run: |
          node --check frontend/app.js
          docker build -t caixalivre-frontend-test ./frontend
