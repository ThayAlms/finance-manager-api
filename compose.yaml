services:
  postgres:
    image: postgres:16-alpine
    container_name: finai-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-finai}
      POSTGRES_USER: ${DB_USERNAME:-finai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finai}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - finai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: finai-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-finai}
      DB_USERNAME: ${DB_USERNAME:-finai}
      DB_PASSWORD: ${DB_PASSWORD:-finai}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  finai_postgres_data:
